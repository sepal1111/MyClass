<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" font-family="Microsoft JhengHei, PingFang TC, sans-serif">
  <rect width="860" height="250" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="20" y="28" font-size="14" fill="#9ca3af">示意圖</text>
  <rect x="30" y="45" width="560" height="180" rx="8" fill="#012456"/>
  <rect x="30" y="45" width="560" height="28" rx="8" fill="#1e3a5f"/>
  <text x="42" y="64" font-size="13" fill="#e2e8f0">Windows PowerShell</text>
  <text x="42" y="100" font-size="13" fill="#e2e8f0" font-family="Consolas, monospace">PS D:\MyClass&gt; New-Item -ItemType Directory ...</text>
  <text x="42" y="122" font-size="13" fill="#e2e8f0" font-family="Consolas, monospace">&gt;&gt; $ts = "C:\Program Files\Tailscale\tailscale.exe"</text>
  <text x="42" y="144" font-size="13" fill="#e2e8f0" font-family="Consolas, monospace">&gt;&gt; ...</text>
  <rect x="300" y="160" width="160" height="40" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="315" y="186" font-size="15" fill="#111827">在視窗裡按右鍵</text>
  <text x="615" y="95" font-size="16" font-weight="bold" fill="#1e3a8a">貼上的方法（擇一）</text>
  <text x="615" y="128" font-size="15" fill="#334155">● 在藍色視窗裡按「滑鼠右鍵」</text>
  <text x="615" y="158" font-size="15" fill="#334155">● 或按鍵盤 Ctrl ＋ V</text>
  <text x="615" y="198" font-size="15" fill="#334155">貼上後，再按一次 Enter</text>
</svg>
