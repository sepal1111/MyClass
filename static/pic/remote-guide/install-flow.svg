    <text x="320" y="150" font-size="12" fill="#475569">打勾同意 → Install</text>
    <rect x="445" y="55" width="170" height="110" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="530" y="95" font-size="28">🔑</text>
