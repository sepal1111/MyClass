<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" font-family="Microsoft JhengHei, PingFang TC, sans-serif">
  <rect width="860" height="200" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
