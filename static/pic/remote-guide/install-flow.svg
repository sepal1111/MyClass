    <text x="110" y="128" font-weight="bold" fill="#1e3a8a">① 下載</text>
    <text x="110" y="150" font-size="12" fill="#475569">官網按 Download</text>
    <rect x="235" y="55" width="170" height="110" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="320" y="95" font-size="28">🛠️</text>
