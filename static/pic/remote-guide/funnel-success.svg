  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker></defs>
  <rect x="30" y="45" width="560" height="230" rx="8" fill="#012456"/>
  <rect x="30" y="45" width="560" height="28" rx="8" fill="#1e3a5f"/>
